<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c00000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lift Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, thumb-reach bottom nav. Day tabs on top, one card per lift, set rows inside. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface2:#e8eeea; --ink:#13201b; --muted:#566660; --line:#d3dcd7;
  --accent:#c00000; --accent-ink:#ffffff;
  --hit:#177a43; --hit-bg:#ddf2e5; --warn:#8f5200; --warn-bg:#fbebd0;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1311; --surface:#161d1a; --surface2:#1f2824; --ink:#e7eeea; --muted:#92a39b; --line:#2a3631;
    --accent:#ff5a4f; --accent-ink:#1a0504;
    --hit:#5fd68c; --hit-bg:#163524; --warn:#f0b35a; --warn-bg:#3a2a10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1311; --surface:#161d1a; --surface2:#1f2824; --ink:#e7eeea; --muted:#92a39b; --line:#2a3631;
  --accent:#ff5a4f; --accent-ink:#1a0504;
  --hit:#5fd68c; --hit-bg:#163524; --warn:#f0b35a; --warn-bg:#3a2a10;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(14px + env(safe-area-inset-top,0px)) 92px;
}
main,header{max-width:560px;margin-inline:auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0}
#status{font-size:12px;color:var(--muted);text-align:right}
h2{font-family:var(--font-display);font-weight:700;font-size:22px;margin:0;letter-spacing:.01em}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:600}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.daytabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.daytab{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;min-width:0}
.daytab b{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.1}
.daytab span{font-size:12px;color:var(--muted)}
.daytab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daytab.on span{color:var(--accent-ink);opacity:.85}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.sess{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sess .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select{font:inherit;color:var(--ink)}
.t{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;width:100%;min-width:0;font-size:16px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{font-size:12px;font-weight:600;background:var(--surface2);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sug{margin-top:6px;font-size:13px;color:var(--muted)}
.sug b{color:var(--ink);font-weight:600}
.grid-h,.row{display:grid;grid-template-columns:1.6rem repeat(var(--n),minmax(0,1fr));gap:8px;align-items:center}
.grid-h{margin-top:12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.sets{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.row .n{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--muted);text-align:center}
.in{height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;min-width:0;text-align:center;font-size:18px;font-variant-numeric:tabular-nums;padding:0 4px}
select.in{padding:0 2px;text-align-last:center}
.in.hit{border-color:var(--hit);background:var(--hit-bg);color:var(--hit);font-weight:600}
.badge{margin-top:10px;font-size:13px;font-weight:600;color:var(--hit);background:var(--hit-bg);border-radius:8px;padding:7px 10px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.5;cursor:default}
.note{margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(12px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px))}
nav .in-nav{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav button{font:inherit;font-size:14px;font-weight:600;color:var(--muted);background:none;border:0;border-radius:8px;padding:12px 4px;cursor:pointer}
nav button.on{color:var(--accent);background:var(--surface2)}
.hist-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hist-ex{margin-top:8px;font-size:13px}
.hist-ex b{font-weight:600}
.hist-ex span{color:var(--muted);font-variant-numeric:tabular-nums}
.tick{color:var(--hit);font-weight:700}
.flag{padding:10px 12px;border-radius:8px;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.flag.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.flag.good{background:var(--hit-bg);border-color:transparent;color:var(--hit)}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{display:block;font-family:var(--font-display);font-size:26px;color:var(--ink);line-height:1.1}
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{fill:var(--muted);font:10px var(--font-body)}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><h1>Lift Log</h1><div id="status" aria-live="polite"></div></header>
<main id="main"></main>
<nav><div class="in-nav">
  <button id="nav-log" type="button">Log</button>
  <button id="nav-history" type="button">History</button>
  <button id="nav-progress" type="button">Progress</button>
</div></nav>

<script>
(function(){
'use strict';

/* ---------- Program ---------- */
var DAYS=[
 {key:'mon',tab:'Mon',title:'Push',ex:[
  {id:'bench',name:'Barbell Bench Press',sets:4,lo:6,hi:8,kind:'lift',step:5,start:135},
  {id:'dbpress',name:'Seated DB Shoulder Press',sets:3,lo:8,hi:10,kind:'lift',step:5,start:40},
  {id:'incdb',name:'Incline DB Press',sets:3,lo:10,hi:12,kind:'lift',step:5,start:50},
  {id:'latraise',name:'Cable Lateral Raises',sets:3,lo:12,hi:15,kind:'lift',step:2.5,start:10},
  {id:'pushdown',name:'Tricep Pushdowns',sets:3,lo:12,hi:15,kind:'lift',step:5,start:50},
  {id:'ohext',name:'Overhead Tricep Extension',sets:2,lo:10,hi:12,kind:'lift',step:5,start:40}]},
 {key:'tue',tab:'Tue',title:'Legs',ex:[
  {id:'squat',name:'Barbell Squats',sets:4,lo:6,hi:8,kind:'lift',step:10,start:135},
  {id:'legpress',name:'Leg Press',sets:3,lo:10,hi:12,kind:'lift',step:10,start:180},
  {id:'lunge',name:'Walking Lunges (per leg, each hand)',sets:3,lo:10,hi:10,kind:'lift',step:5,start:30},
  {id:'legext',name:'Leg Extensions',sets:2,lo:15,hi:15,kind:'lift',step:5,start:80},
  {id:'calf',name:'Standing Calf Raises',sets:4,lo:25,hi:50,kind:'lift',step:10,start:100},
  {id:'hanglr',name:'Hanging Leg Raises',sets:3,lo:15,hi:15,kind:'reps',step:0}]},
 {key:'thu',tab:'Thu',title:'Pull',ex:[
  {id:'pulldown',name:'Pull-Ups / Lat Pulldown',sets:4,lo:8,hi:10,kind:'lift',step:5,start:120,bw:true},
  {id:'reardelt',name:'Rear Delt Flys',sets:3,lo:8,hi:12,kind:'lift',step:2.5,start:15},
  {id:'row',name:'Barbell Rows',sets:3,lo:8,hi:10,kind:'lift',step:5,start:95},
  {id:'cablerow',name:'Seated Cable Rows',sets:3,lo:10,hi:12,kind:'lift',step:5,start:100},
  {id:'facepull',name:'Face Pulls',sets:3,lo:15,hi:20,kind:'lift',step:2.5,start:40},
  {id:'bbcurl',name:'Barbell Curls',sets:3,lo:10,hi:12,kind:'lift',step:5,start:50},
  {id:'hammer',name:'Hammer Curls',sets:2,lo:10,hi:12,kind:'lift',step:5,start:25}]},
 {key:'fri',tab:'Fri',title:'Hams + Core',ex:[
  {id:'rdl',name:'Romanian Deadlifts',sets:4,lo:8,hi:10,kind:'lift',step:10,start:135},
  {id:'legcurl',name:'Lying Leg Curls',sets:3,lo:10,hi:12,kind:'lift',step:5,start:70},
  {id:'hipthrust',name:'Hip Thrusts',sets:3,lo:10,hi:12,kind:'lift',step:10,start:135},
  {id:'bulg',name:'Bulgarian Split Squats (per leg, each hand)',sets:2,lo:10,hi:10,kind:'lift',step:5,start:25},
  {id:'plank',name:'Plank',sets:3,lo:60,hi:60,kind:'time',step:10},
  {id:'wcrunch',name:'Weighted Crunches',sets:3,lo:15,hi:20,kind:'lift',step:5,start:50}]}
];
var EX={}, ORDER=[];
DAYS.forEach(function(d){d.ex.forEach(function(e){e.day=d.key;EX[e.id]=e;ORDER.push(e);});});
var DAYBY={}; DAYS.forEach(function(d){DAYBY[d.key]=d;});

/* ---------- Helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs){for(var k in attrs){var v=attrs[k]; if(v==null||v===false)continue;
    if(k==='class')el.className=v; else if(k==='text')el.textContent=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='type'||k==='min'||k==='max'||k==='step'||k==='id'||k==='placeholder'||k==='disabled'||k==='selected'){el[k]=v;}
    else el.setAttribute(k,v);}}
  for(var i=2;i<arguments.length;i++){add(el,arguments[i]);}
  return el;
}
function add(el,c){
  if(c==null||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){add(el,x);});return;}
  el.appendChild(c.nodeType?c:document.createTextNode(String(c)));
}
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function fmtD(s){return parseD(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function dayFor(s){var wd=parseD(s).getDay();return ({0:'mon',1:'mon',2:'tue',3:'thu',4:'thu',5:'fri',6:'mon'})[wd];}
function num(v){return typeof v==='number'&&isFinite(v);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function range(ex){return ex.lo===ex.hi?String(ex.hi):ex.lo+'-'+ex.hi;}
function target(ex){return ex.sets+' × '+(ex.kind==='time'?ex.hi+' sec':range(ex));}

/* ---------- State ---------- */
var S={sessions:{},view:'log',day:null,date:todayStr(),pick:'bench'};
S.day=dayFor(S.date);
var LS_KEY='liftlog.v1';

function sid(){return 's-'+S.date+'-'+S.day;}
function hasData(d){
  if(!d)return false;
  if(num(d.bw)||d.note)return true;
  for(var k in d.ex){var e=d.ex[k]; if(e.note)return true; if(e.sets.some(function(s){return s&&s.r>0;}))return true;}
  return false;
}
function getDoc(create){
  var id=sid(), d=S.sessions[id];
  if(!d&&create){d=S.sessions[id]={date:S.date,day:S.day,bw:null,note:'',ex:{},updated:0};}
  return d;
}
function getEx(ex,create){
  var d=getDoc(create); if(!d)return null;
  var e=d.ex[ex.id]; if(!e&&create){e=d.ex[ex.id]={sets:[],note:''};}
  return e||null;
}
function getSet(ex,i,create){
  var e=getEx(ex,create); if(!e)return null;
  while(create&&e.sets.length<=i){e.sets.push({w:null,r:null,l:null});}
  return e.sets[i]||null;
}
function logged(sets){return sets.filter(function(s){return s&&s.r>0;});}

/* ---------- Saving ---------- */
var timers={};
function setStatus(t){var el=$('#status'); if(el)el.textContent=t;}
function mirror(){try{localStorage.setItem(LS_KEY,JSON.stringify(S.sessions));return true;}catch(e){return false;}}
function queueSave(id){
  id=id||sid();
  var d=S.sessions[id]; if(d)d.updated=Date.now();
  setStatus('Saving…');
  clearTimeout(timers[id]);
  timers[id]=setTimeout(function(){flush(id);},600);
}
function flush(id){
  var d=S.sessions[id];
  if(d&&!hasData(d)){delete S.sessions[id]; d=null;}
  setStatus(mirror()?'Saved on this phone':'Could not save. Storage is blocked or full.');
}
function loadLocal(){
  try{var raw=localStorage.getItem(LS_KEY); if(raw){var o=JSON.parse(raw); if(o&&typeof o==='object')S.sessions=o;}}catch(e){}
}
function initPersist(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  setStatus('Stored on this phone');
}

/* ---------- History logic ---------- */
function logsFor(exId,beforeDate){
  var out=[];
  Object.keys(S.sessions).forEach(function(id){
    var d=S.sessions[id], e=d.ex&&d.ex[exId]; if(!e)return;
    if(beforeDate&&!(d.date<beforeDate))return;
    var sets=logged(e.sets); if(!sets.length)return;
    out.push({id:id,date:d.date,sets:sets,note:e.note});
  });
  out.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1);});
  return out;
}
function topW(sets){
  var ws=sets.map(function(s){return s.w;}).filter(num);
  return ws.length?Math.max.apply(null,ws):null;
}
function hitAll(ex,sets){return sets.length>=ex.sets&&sets.every(function(s){return s.r>=ex.hi;});}
function fmtSet(ex,s){
  if(ex.kind==='time')return s.r+'s';
  if(ex.kind==='reps')return String(s.r);
  return (num(s.w)?s.w:'BW')+'×'+s.r;
}
function suggest(ex){
  var last=logsFor(ex.id,S.date)[0];
  if(!last){
    var t=ex.kind==='lift'
      ?(num(ex.start)?'First time. Start near '+ex.start+' lb and adjust. Last 2 reps should be hard but clean.':'First time. Pick a weight where the last 2 reps are hard.')
      :'First time. Log what you get.';
    return {last:null,w:num(ex.start)?ex.start:null,text:t};
  }
  var sets=last.sets, tw=topW(sets), hit=hitAll(ex,sets), minr=Math.min.apply(null,sets.map(function(s){return s.r;}));
  var res={last:sets.map(function(s){return fmtSet(ex,s);}).join(', '),date:last.date,hit:hit,w:tw};
  if(ex.kind==='lift'){
    if(hit){res.w=num(tw)?tw+ex.step:null; res.text=num(tw)?'Hit the top last time. Go up to '+res.w+' lb.':'Hit the top last time. Add weight or move to a harder version.';}
    else{res.text=(num(tw)?'Stay at '+tw+' lb. ':'')+'Get '+ex.hi+' reps on every set (lowest last time: '+minr+').';}
  }else if(ex.kind==='time'){
    res.text=hit?'Hit the time last time. Add 10 sec.':'Hold '+ex.hi+' sec on every set (lowest last time: '+minr+').';
  }else{
    res.text=hit?'Hit the target last time. Slow the reps down or add weight.':'Get '+ex.hi+' reps on every set (lowest last time: '+minr+').';
  }
  return res;
}

/* ---------- Log view ---------- */
function updateCard(ex,card){
  var e=getEx(ex,false), sets=e?logged(e.sets):[];
  card.querySelectorAll('input.r').forEach(function(inp){
    var v=Number(inp.value); inp.classList.toggle('hit',inp.value!==''&&v>=ex.hi);
  });
  var b=card.querySelector('.badge'); if(b)b.hidden=!hitAll(ex,sets);
}
function renderEx(ex){
  var sg=suggest(ex), cols=ex.kind==='lift'?3:(ex.kind==='time'?1:2);
  var e=getEx(ex,false), n=Math.max(ex.sets,e?e.sets.length:0);
  var card=h('section',{class:'card'});
  card.appendChild(h('div',{class:'ex-head'},h('h2',{text:ex.name}),h('span',{class:'chip',text:target(ex)})));
  var sug=h('p',{class:'sug'});
  if(sg.last){sug.appendChild(h('span',{text:'Last ('+fmtD(sg.date)+'): '+sg.last}));sug.appendChild(h('br'));}
  sug.appendChild(h('b',{text:sg.text}));
  card.appendChild(sug);
  var head=h('div',{class:'grid-h',style:'--n:'+cols},h('span',{text:'Set'}));
  if(ex.kind==='lift')head.appendChild(h('span',{text:'lb'}));
  head.appendChild(h('span',{text:ex.kind==='time'?'Sec':'Reps'}));
  if(ex.kind!=='time')head.appendChild(h('span',{text:'Left'}));
  card.appendChild(head);
  var rows=h('div',{class:'sets'});
  function addRow(i){
    var s=(getEx(ex,false)||{sets:[]}).sets[i]||{};
    var row=h('div',{class:'row',style:'--n:'+cols},h('span',{class:'n',text:String(i+1)}));
    if(ex.kind==='lift'){
      var w=h('input',{type:'number',class:'in w',step:'0.5',min:'0',inputmode:'decimal',
        placeholder:num(sg.w)?String(sg.w):(ex.bw?'BW':'lb'),value:num(s.w)?s.w:'','aria-label':ex.name+' set '+(i+1)+' weight'});
      w.addEventListener('input',function(){
        var v=w.value; getSet(ex,i,true).w=v===''?null:Number(v);
        if(i===0&&v!==''){
          rows.querySelectorAll('input.w').forEach(function(inp,j){
            if(j>0&&inp.value===''){inp.value=v;getSet(ex,j,true).w=Number(v);}
          });
        }
        queueSave();
      });
      row.appendChild(w);
    }
    var r=h('input',{type:'number',class:'in r',step:'1',min:'0',inputmode:'numeric',
      placeholder:ex.kind==='time'?String(ex.hi):range(ex),value:num(s.r)?s.r:'','aria-label':ex.name+' set '+(i+1)+(ex.kind==='time'?' seconds':' reps')});
    r.addEventListener('input',function(){
      var v=r.value; getSet(ex,i,true).r=v===''?null:Number(v);
      queueSave(); updateCard(ex,card);
    });
    row.appendChild(r);
    if(ex.kind!=='time'){
      var l=h('select',{class:'in l','aria-label':ex.name+' set '+(i+1)+' reps left in the tank'});
      [['','—'],['0','0'],['1','1'],['2','2'],['3','3'],['4','4+']].forEach(function(o){
        l.appendChild(h('option',{value:o[0],text:o[1],selected:(num(s.l)&&String(s.l)===o[0])}));
      });
      l.addEventListener('change',function(){getSet(ex,i,true).l=l.value===''?null:Number(l.value);queueSave();});
      row.appendChild(l);
    }
    rows.appendChild(row);
  }
  for(var i=0;i<n;i++)addRow(i);
  card.appendChild(rows);
  card.appendChild(h('div',{class:'badge',hidden:true,text:'Top of range on every set. Go up next time.'}));
  var acts=h('div',{class:'acts'});
  if(ex.kind==='lift'&&num(sg.w)){
    acts.appendChild(h('button',{type:'button',class:'btn p',text:'Fill '+sg.w+' lb',onclick:function(){
      rows.querySelectorAll('input.w').forEach(function(inp,j){
        if(inp.value===''){inp.value=sg.w;getSet(ex,j,true).w=sg.w;}
      });
      queueSave();
    }}));
  }
  var rm=h('button',{type:'button',class:'btn',text:'− Set',hidden:true,onclick:function(){
    var cnt=rows.children.length; if(cnt<=ex.sets)return;
    var e2=getEx(ex,false); if(e2&&e2.sets.length>=cnt)e2.sets.length=cnt-1;
    rows.removeChild(rows.lastChild); syncRm();
    queueSave(); updateCard(ex,card);
  }});
  function syncRm(){rm.hidden=rows.children.length<=ex.sets;}
  acts.appendChild(h('button',{type:'button',class:'btn',text:'+ Set',onclick:function(){addRow(rows.children.length);syncRm();}}));
  acts.appendChild(rm); syncRm();
  card.appendChild(acts);
  var note=h('input',{type:'text',class:'t note',id:'note-'+ex.id,placeholder:'Notes: form, pain, equipment, anything off',
    value:(e&&e.note)||'','aria-label':ex.name+' notes'});
  note.addEventListener('input',function(){getEx(ex,true).note=note.value;queueSave();});
  card.appendChild(note);
  updateCard(ex,card);
  return card;
}
function renderLog(){
  var wrap=h('div');
  var tabs=h('div',{class:'daytabs',role:'tablist'});
  DAYS.forEach(function(d){
    tabs.appendChild(h('button',{type:'button',class:'daytab'+(d.key===S.day?' on':''),role:'tab','aria-selected':String(d.key===S.day),
      onclick:function(){S.day=d.key;render(true);}},h('b',{text:d.tab}),h('span',{text:d.title})));
  });
  wrap.appendChild(tabs);
  var d=getDoc(false);
  var sess=h('div',{class:'card sess'});
  var date=h('input',{type:'date',class:'t',id:'f-date',value:S.date});
  date.addEventListener('change',function(){
    if(!date.value)return; S.date=date.value; S.day=dayFor(S.date); render(true);
  });
  var bw=h('input',{type:'number',class:'t',id:'f-bw',step:'0.1',min:'0',inputmode:'decimal',placeholder:'e.g. 200',value:d&&num(d.bw)?d.bw:''});
  bw.addEventListener('input',function(){getDoc(true).bw=bw.value===''?null:Number(bw.value);queueSave();});
  var note=h('input',{type:'text',class:'t',id:'f-note',placeholder:'Sleep, energy, how it felt overall',value:(d&&d.note)||''});
  note.addEventListener('input',function(){getDoc(true).note=note.value;queueSave();});
  sess.appendChild(h('label',{class:'f'},'Date',date));
  sess.appendChild(h('label',{class:'f'},'Bodyweight (lb)',bw));
  sess.appendChild(h('label',{class:'f full'},'Session notes',note));
  wrap.appendChild(sess);
  var list=h('div',{class:'stack',style:'margin-top:12px'});
  DAYBY[S.day].ex.forEach(function(ex){list.appendChild(renderEx(ex));});
  wrap.appendChild(list);
  return wrap;
}

/* ---------- History view ---------- */
function sortedSessions(){
  return Object.keys(S.sessions).filter(function(id){return hasData(S.sessions[id]);}).sort(function(a,b){
    var x=S.sessions[a], y=S.sessions[b];
    return x.date<y.date?1:x.date>y.date?-1:(a<b?1:-1);
  });
}
function download(name,type,text){
  try{
    var url=URL.createObjectURL(new Blob([text],{type:type}));
    var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    setStatus('Saved '+name);
  }catch(e){setStatus('Download failed');}
}
function backupJson(){
  download('lift-log-backup-'+todayStr()+'.json','application/json',JSON.stringify({app:'lift-log',version:1,sessions:(function(){var o={};Object.keys(S.sessions).forEach(function(id){if(hasData(S.sessions[id]))o[id]=S.sessions[id];});return o;})()}));
}
function restoreFrom(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(rd.result);
      if(!o||o.app!=='lift-log'||!o.sessions||typeof o.sessions!=='object')throw new Error('bad');
      var n=0;
      Object.keys(o.sessions).forEach(function(id){
        var d=o.sessions[id];
        if(!/^s-\d{4}-\d{2}-\d{2}-(mon|tue|thu|fri)$/.test(id)||!d||typeof d!=='object'||!d.ex||typeof d.ex!=='object')return;
        var ok=Object.keys(d.ex).every(function(k){return d.ex[k]&&Array.isArray(d.ex[k].sets);});
        if(!ok||!hasData(d))return;
        var l=S.sessions[id];
        if(!l||(d.updated||0)>(l.updated||0)){S.sessions[id]=d;n++;}
      });
      mirror(); setStatus('Restored '+n+' session'+(n===1?'':'s')); render(false);
    }catch(e){setStatus('That file is not a Lift Log backup');}
  };
  rd.readAsText(file);
}
function csvCell(v){
  if(v==null)return '';
  var s=String(v);
  if(typeof v==='string'&&/^[=+\-@\t\r]/.test(s))s="'"+s;
  return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function exportCsv(){
  var rows=[['date','day','exercise','set','weight_lb','reps_or_sec','reps_left','hit_top','bodyweight_lb','session_note','exercise_note']];
  sortedSessions().reverse().forEach(function(id){
    var d=S.sessions[id];
    ORDER.forEach(function(ex){
      var e=d.ex[ex.id]; if(!e)return;
      e.sets.forEach(function(s,i){
        if(!(s&&s.r>0))return;
        rows.push([d.date,d.day,ex.name,i+1,num(s.w)?s.w:'',s.r,num(s.l)?s.l:'',s.r>=ex.hi?'yes':'no',num(d.bw)?d.bw:'',d.note||'',e.note||'']);
      });
    });
  });
  var csv=rows.map(function(r){return r.map(csvCell).join(',');}).join('\n');
  download('lift-log.csv','text/csv',csv);
}
function renderHistory(){
  var wrap=h('div',{class:'stack'});
  var ids=sortedSessions();
  var top=h('div',{class:'hist-h'},h('h2',{text:ids.length?ids.length+' session'+(ids.length===1?'':'s'):'No sessions yet'}));
  wrap.appendChild(top);
  var file=h('input',{type:'file',id:'f-restore',accept:'application/json,.json',hidden:true});
  file.addEventListener('change',function(){if(file.files&&file.files[0])restoreFrom(file.files[0]);file.value='';});
  wrap.appendChild(h('div',{class:'acts',style:'margin-top:0'},
    h('button',{type:'button',class:'btn',text:'Export CSV',disabled:!ids.length,onclick:exportCsv}),
    h('button',{type:'button',class:'btn',text:'Backup',disabled:!ids.length,onclick:backupJson}),
    h('button',{type:'button',class:'btn',text:'Restore',onclick:function(){file.click();}}),file));
  if(!ids.length){wrap.appendChild(h('p',{class:'empty',text:'Log your first set on the Log tab. Every session shows up here with all its sets.'}));return wrap;}
  ids.forEach(function(id){
    var d=S.sessions[id], card=h('section',{class:'card'});
    card.appendChild(h('div',{class:'hist-h'},
      h('h2',{text:fmtD(d.date)+' · '+(DAYBY[d.day]?DAYBY[d.day].title:'')}),
      h('button',{type:'button',class:'btn',text:'Edit',onclick:function(){S.date=d.date;S.day=d.day;S.view='log';render(true);}})));
    var meta=[]; if(num(d.bw))meta.push(d.bw+' lb bodyweight'); if(d.note)meta.push(d.note);
    if(meta.length)card.appendChild(h('p',{class:'sug',text:meta.join(' · ')}));
    ORDER.forEach(function(ex){
      var e=d.ex[ex.id]; if(!e)return;
      var sets=logged(e.sets); if(!sets.length&&!e.note)return;
      var line=h('p',{class:'hist-ex'},h('b',{text:ex.name+' '}));
      line.appendChild(h('span',{text:sets.map(function(s){return fmtSet(ex,s);}).join('  ')}));
      if(hitAll(ex,sets))line.appendChild(h('span',{class:'tick',text:'  ✓'}));
      card.appendChild(line);
      if(e.note)card.appendChild(h('p',{class:'sug',text:'Note: '+e.note}));
    });
    wrap.appendChild(card);
  });
  return wrap;
}

/* ---------- Progress view ---------- */
function svgEl(tag,attrs){
  var el=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(var k in attrs)el.setAttribute(k,attrs[k]);
  return el;
}
function chart(points,unit){
  if(points.length<2)return h('p',{class:'empty',text:'Two sessions needed before there is a line to draw.'});
  var W=320,H=140,L=38,R=10,T=10,B=24;
  var ys=points.map(function(p){return p.y;}), min=Math.min.apply(null,ys), max=Math.max.apply(null,ys);
  if(min===max){min-=1;max+=1;}
  var svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'chart',role:'img','aria-label':'Trend chart'});
  function X(i){return L+(W-L-R)*i/(points.length-1);}
  function Y(v){return T+(H-T-B)*(1-(v-min)/(max-min));}
  [min,max].forEach(function(v){
    var ln=svgEl('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v)}); ln.style.stroke='var(--line)'; ln.style.strokeWidth='1'; svg.appendChild(ln);
    var tx=svgEl('text',{x:L-6,y:Y(v)+3,'text-anchor':'end'}); tx.textContent=String(Math.round(v*10)/10); svg.appendChild(tx);
  });
  var d=points.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
  var path=svgEl('path',{d:d,fill:'none'}); path.style.stroke='var(--accent)'; path.style.strokeWidth='2'; path.style.strokeLinejoin='round'; svg.appendChild(path);
  points.forEach(function(p,i){
    var c=svgEl('circle',{cx:X(i),cy:Y(p.y),r:i===points.length-1?4:3}); c.style.fill='var(--accent)';
    var t=svgEl('title',{}); t.textContent=fmtD(p.date)+': '+p.y+' '+unit; c.appendChild(t); svg.appendChild(c);
  });
  var a=svgEl('text',{x:L,y:H-6,'text-anchor':'start'}); a.textContent=fmtD(points[0].date); svg.appendChild(a);
  var b=svgEl('text',{x:W-R,y:H-6,'text-anchor':'end'}); b.textContent=fmtD(points[points.length-1].date); svg.appendChild(b);
  return svg;
}
function renderProgress(){
  var wrap=h('div');
  var ids=sortedSessions();
  if(!ids.length){
    wrap.appendChild(h('h2',{text:'Progress'}));
    wrap.appendChild(h('p',{class:'empty',text:'Nothing to chart yet. Log a few sessions and the flags, trends and tables fill in here.'}));
    return wrap;
  }
  var sets=0, week=0, cutoff=todayStr();
  var cd=new Date(); cd.setDate(cd.getDate()-6); cutoff=cd.getFullYear()+'-'+pad(cd.getMonth()+1)+'-'+pad(cd.getDate());
  ids.forEach(function(id){
    var d=S.sessions[id]; if(d.date>=cutoff)week++;
    Object.keys(d.ex).forEach(function(k){sets+=logged(d.ex[k].sets).length;});
  });
  wrap.appendChild(h('div',{class:'stats'},
    h('span',{},h('b',{text:String(ids.length)}),'sessions'),
    h('span',{},h('b',{text:String(week)}),'last 7 days'),
    h('span',{},h('b',{text:String(sets)}),'sets logged')));

  var up=[], stuck=[], short=[];
  ORDER.forEach(function(ex){
    var logs=logsFor(ex.id); if(!logs.length)return;
    var l0=logs[0];
    if(hitAll(ex,l0.sets)){
      var tw=topW(l0.sets);
      up.push(ex.name+(ex.kind==='lift'&&num(tw)?' → '+(tw+ex.step)+' lb':''));
    }
    if(logs.length>=3){
      var l3=logs.slice(0,3), w0=topW(l3[0].sets);
      var same=ex.kind==='lift'?(l3.every(function(l){return topW(l.sets)===w0;})):true;
      var none=l3.every(function(l){return !hitAll(ex,l.sets);});
      if(same&&none)stuck.push(ex.name+(num(w0)?' at '+w0+' lb':'')+', 3 sessions without hitting '+ex.hi);
      if(l3.every(function(l){return l.sets.length<ex.sets;}))short.push(ex.name+': fewer than '+ex.sets+' sets for 3 sessions');
    }
  });
  wrap.appendChild(h('h3',{text:'Flags'}));
  var flags=h('div',{class:'stack'});
  if(up.length)flags.appendChild(h('div',{class:'flag good',text:'Ready to go up: '+up.join(', ')}));
  stuck.forEach(function(t){flags.appendChild(h('div',{class:'flag warn',text:'Stuck: '+t}));});
  short.forEach(function(t){flags.appendChild(h('div',{class:'flag warn',text:'Skipping sets: '+t}));});
  if(!flags.children.length)flags.appendChild(h('p',{class:'empty',text:'No flags yet. Stuck lifts and skipped sets show up after 3 sessions of the same exercise.'}));
  wrap.appendChild(flags);

  var bws=ids.slice().reverse().map(function(id){var d=S.sessions[id];return num(d.bw)?{date:d.date,y:d.bw}:null;}).filter(Boolean);
  if(bws.length){
    wrap.appendChild(h('h3',{text:'Bodyweight'}));
    wrap.appendChild(h('div',{class:'card'},chart(bws,'lb')));
  }

  wrap.appendChild(h('h3',{text:'Lift trend'}));
  var sel=h('select',{class:'t',id:'f-pick','aria-label':'Choose exercise'});
  DAYS.forEach(function(d){
    var g=h('optgroup',{label:d.tab+' '+d.title});
    d.ex.forEach(function(ex){g.appendChild(h('option',{value:ex.id,text:ex.name,selected:ex.id===S.pick}));});
    sel.appendChild(g);
  });
  sel.addEventListener('change',function(){S.pick=sel.value;render(false);});
  wrap.appendChild(sel);
  var ex=EX[S.pick]||EX.bench, logs=logsFor(ex.id).reverse();
  var card=h('div',{class:'card',style:'margin-top:10px'});
  if(!logs.length){card.appendChild(h('p',{class:'empty',text:'No sets logged for this lift yet.'}));}
  else{
    var pts=logs.map(function(l){
      var y=ex.kind==='lift'&&num(topW(l.sets))?topW(l.sets):Math.max.apply(null,l.sets.map(function(s){return s.r;}));
      return {date:l.date,y:y};
    });
    var unit=ex.kind==='lift'&&num(topW(logs[0].sets))?'lb (top set)':(ex.kind==='time'?'sec':'reps');
    card.appendChild(h('p',{class:'sug',text:'Top '+unit+' per session'}));
    card.appendChild(chart(pts,unit));
    var tb=h('table'), thead=h('thead'), hr=h('tr');
    ['Date','Sets','Top','Vol',''].forEach(function(t){hr.appendChild(h('th',{text:t}));});
    thead.appendChild(hr); tb.appendChild(thead);
    var tbody=h('tbody');
    logs.slice().reverse().forEach(function(l){
      var tw=topW(l.sets), vol=l.sets.reduce(function(a,s){return a+(num(s.w)?s.w:0)*s.r;},0);
      var tr=h('tr');
      tr.appendChild(h('td',{text:fmtD(l.date)}));
      tr.appendChild(h('td',{text:l.sets.map(function(s){return s.r;}).join(', ')}));
      tr.appendChild(h('td',{text:num(tw)?String(tw):'BW'}));
      tr.appendChild(h('td',{text:vol?String(Math.round(vol)):'-'}));
      tr.appendChild(h('td',{class:'tick',text:hitAll(ex,l.sets)?'✓':''}));
      tbody.appendChild(tr);
    });
    tb.appendChild(tbody);
    card.appendChild(h('div',{class:'tablewrap'},tb));
    card.appendChild(h('p',{class:'sug',text:'Vol = weight × reps summed over sets. ✓ = every set hit the top of the range.'}));
  }
  wrap.appendChild(card);
  return wrap;
}

/* ---------- Shell ---------- */
function render(toTop){
  var main=$('#main'), el;
  if(S.view==='log')el=renderLog(); else if(S.view==='history')el=renderHistory(); else el=renderProgress();
  main.replaceChildren(el);
  ['log','history','progress'].forEach(function(v){
    var b=$('#nav-'+v); b.classList.toggle('on',S.view===v); b.setAttribute('aria-current',S.view===v?'page':'false');
  });
  if(toTop)window.scrollTo(0,0);
}
['log','history','progress'].forEach(function(v){
  $('#nav-'+v).addEventListener('click',function(){S.view=v;render(true);});
});

loadLocal();
render(true);
initPersist();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
